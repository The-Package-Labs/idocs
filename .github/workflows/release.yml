name: Release
# Publishes the @the-package-labs/idocs-* packages and create-idocs to npm through changesets.
# Off until you opt in: set the repository variable RELEASE_ENABLED to "true" and add an NPM_TOKEN
# secret (an npm automation token that can publish to the @the-package-labs org and the create-idocs name). See docs/REPOSITORIES.md.
on:
  push:
    branches: [main]

concurrency: release

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
